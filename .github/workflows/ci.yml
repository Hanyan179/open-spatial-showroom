name: Build and validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: npm test
      - run: npm run check:public
      - uses: actions/upload-artifact@v4
        with:
          name: showroom-static-site
          path: dist/
